services:
  product-mysql:
    image: mysql:8.4
    container_name: bth3-product-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: local_root_password
      MYSQL_DATABASE: BTH3_PRODUCT
      MYSQL_USER: product_user
      MYSQL_PASSWORD: product_pass
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - product_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  product_mysql_data:
