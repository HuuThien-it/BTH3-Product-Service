spring.application.name=bth3-product-service
server.port=${SERVER_PORT:8081}

# Database belongs ONLY to Product Service.
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3306}/${DB_NAME:BTH3_PRODUCT}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Suitable for classroom development; use migrations and validate in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
